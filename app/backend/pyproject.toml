[project]
name = "bm"
version = "0.1.0"
description = "LLM Budget Manager: решения allow/deny/redirect и учёт расхода LLM в бюджетах подразделений"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
# Прямые зависимости закреплены точно (12_tasks.md T001); транзитивные — uv.lock.
dependencies = [
    "fastapi==0.143.0",
    "asyncpg==0.32.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",            # только в bm.egress (import-linter)
    "argon2-cffi==25.1.0",
    "python-multipart==0.0.32", # multipart/form-data для importOrg (FastAPI UploadFile), T041
    "prometheus-client==0.26.0",
    "tzdata==2026.5",           # Europe/Moscow без системной tzdata в slim-образе
]

[project.optional-dependencies]
# MCP-сервер (P3, урезание 🔻1) — ставится только при необходимости.
mcp = ["mcp==2.3.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "openapi-core==0.23.1",
    "openapi-spec-validator>=0.8,<0.9",  # 0.9.0 несовместим с openapi-core 0.23.1; точная версия — в uv.lock
    "import-linter==2.15",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bm"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма (принцип IX)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "E501"]  # длинные SQL и табличные assert в тестах

[tool.ruff.lint.isort]
known-first-party = ["bm", "tests"]
