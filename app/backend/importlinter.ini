; Архитектурные контракты (12_plan.md §3, §5.2). Запуск: make lint-imports (входит в make lint и make test).
[importlinter]
root_packages =
    bm
include_external_packages = True

[importlinter:contract:egress-only]
; Принцип IV, ADR-006: исходящие соединения — только через bm.egress (T017).
; Запрещены httpx, urllib, http (stdlib, ради http.client) и socket. import-linter не умеет запрещать
; подмодули внешних пакетов, поэтому urllib и http запрещены целиком (включая urllib.parse и http.HTTPStatus).
; Модули, которые используют bm.egress (provider_import, notify), получают цепочку «→ bm.egress → httpx»;
; она разрешена через ignore_imports, а все остальные пути (прямые и косвенные) проверяются.
; (тип forbidden, а не protected: protected требует, чтобы httpx уже был в графе импортов)
name = сетевые библиотеки (httpx, urllib, http, socket) — только в bm.egress
type = forbidden
source_modules =
    bm.db
    bm.domain
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.http
    bm.mcp
    bm.worker
    bm.main
    bm.settings
    bm.metrics
    bm.clock
forbidden_modules =
    httpx
    urllib
    http
    socket
ignore_imports =
    bm.egress.client -> httpx
    bm.egress.client -> urllib
    bm.egress.client -> socket

[importlinter:contract:domain-pure]
; bm.domain — чистые функции: без БД, сети, фреймворков и остальных модулей bm.
name = bm.domain не зависит от ввода-вывода и других модулей bm
type = forbidden
source_modules =
    bm.domain
forbidden_modules =
    bm.db
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.egress
    bm.http
    bm.mcp
    bm.worker
    asyncpg
    httpx
    fastapi
    uvicorn
allow_indirect_imports = False

[importlinter:contract:adapters-thin]
; HTTP, MCP и worker — тонкие адаптеры: ядро их не импортирует.
name = ядро не импортирует адаптеры (http, mcp, worker)
type = forbidden
source_modules =
    bm.domain
    bm.db
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.egress
forbidden_modules =
    bm.http
    bm.mcp
    bm.worker
