; Архитектурные контракты (12_plan.md §3, §5.2). Запуск: make lint-imports (входит в make lint и make test).
[importlinter]
root_packages =
    bm
include_external_packages = True

[importlinter:contract:egress-only]
; Принцип IV: исходящий HTTP — только через bm.egress.
; (тип forbidden, а не protected: protected требует, чтобы httpx уже был в графе импортов)
name = httpx импортирует только bm.egress
type = forbidden
source_modules =
    bm.db
    bm.domain
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.http
    bm.mcp
    bm.worker
forbidden_modules =
    httpx

[importlinter:contract:domain-pure]
; bm.domain — чистые функции: без БД, сети, фреймворков и остальных модулей bm.
name = bm.domain не зависит от ввода-вывода и других модулей bm
type = forbidden
source_modules =
    bm.domain
forbidden_modules =
    bm.db
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.egress
    bm.http
    bm.mcp
    bm.worker
    asyncpg
    httpx
    fastapi
    uvicorn
allow_indirect_imports = False

[importlinter:contract:adapters-thin]
; HTTP, MCP и worker — тонкие адаптеры: ядро их не импортирует.
name = ядро не импортирует адаптеры (http, mcp, worker)
type = forbidden
source_modules =
    bm.domain
    bm.db
    bm.budget
    bm.config
    bm.org_import
    bm.provider_import
    bm.notify
    bm.access
    bm.reports
    bm.egress
forbidden_modules =
    bm.http
    bm.mcp
    bm.worker
