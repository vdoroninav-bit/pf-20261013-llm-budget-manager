# CI LLM Budget Manager (T092; 14_tech_rulings.md, пакет 3, 3Д1(б), 3Д4).
#
# Что проверяет (все шаги — команды Makefile, как у разработчика и на стенде заказчика):
#   test     — make lint, make compose-check, make test против сервиса postgres:18 (закрывает разрыв PG 16 / PG 18),
#              тесты и сборка фронтенда в контейнере node:24-slim (тот же образ, что стадия node-build Dockerfile)
#   delivery — make build, make up && make smoke && make backup && make restore && make smoke, make failover,
#              CHECK_STRICT=1 make check (Trivy по образу), попытка make egress-host-check
# Артефакты прогона (actions/upload-artifact, 4Д3): SBOM и сводка make check (deploy/ci/out), журналы гейтов
# (deploy/ci/out/gha/*.log), журналы compose. sha256 SBOM и сводка make check остаются и в журнале.
#
# Диагностика через аннотации (пакет 4, 4Д1): журнал и артефакты GitHub отдаёт через blob-хранилище, которое
# из среды оркестратора закрыто; доступны статусы шагов и аннотации check-run. Поэтому каждый гейт идёт через
# deploy/ci/gha.py: при падении — ::error title=<шаг>::<хвост вывода или сводка pytest> (≤ 4 КБ), у шагов
# стека — ещё «состояние стека» (compose ps + журналы нездоровых сервисов); в конце задачи — ::notice со
# сводкой гейтов. Не больше 10 аннотаций на задачу. Секреты стенда маскируются ::add-mask:: и заменяются на ***.
# Шаги после упавшего гейта, которым он не нужен, всё равно выполняются (if: steps.<id>.outcome), чтобы один
# прогон показывал статус каждого гейта; задача при этом остаётся красной.
#
# Сторонних actions нет: только actions/checkout и actions/upload-artifact (издатель actions/, 3Д4, 4Д3).
# Секретов в workflow нет: тестам не нужны ключи провайдеров, а пароли стенда генерируются в самом прогоне
# (openssl rand) и живут только на раннере.
# Результат засчитывается в релиз только с журналом (или аннотациями) прогона для того же SHA (3Д1(б), 4Д1).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версии инструментов закреплены (воспроизводимость). uv ставится из PyPI той же версии, что в Dockerfile.
  UV_VERSION: "0.11.32"
  # Образы закреплены по digest из аннотации «Версии и digest базовых образов» прогона 899cf1e (T099, 4Д1 (2)).
  # Обновление — только вместе с журналом CI: шаг digests печатает текущий digest тегов.
  NODE_IMAGE: "node:24-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205"
  TRIVY_IMAGE: "aquasec/trivy:0.58.0@sha256:b88012e2a0a309d6a8a00463d4e63e5e513377fb74eccbc8f9b0f8f81940ebeb"
  # uv скачивает Python 3.13 сам (на раннере его может не быть).
  UV_PYTHON_DOWNLOADS: automatic
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: lint + test (PostgreSQL 18) + frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18@sha256:1267c7e692de235fda2a50dbcdbcbca4672ea6a0298576a6bd9d07cafc319b32
        env:
          POSTGRES_USER: bm
          POSTGRES_PASSWORD: bm
          POSTGRES_DB: bm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bm -d bm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://bm:bm@127.0.0.1:5432/bm_test
      # Статическая проверка compose обязательна: без docker compose тесты tests/deploy падают, а не пропускаются.
      BM_REQUIRE_COMPOSE: "1"
      # vitest и сборка фронтенда — отдельным шагом в контейнере Node 24.
      SKIP_FRONTEND: "1"
    steps:
      # [Факт] v5 разрешилась в прогоне 39552101693 (задача test — SUCCESS).
      - uses: actions/checkout@v5

      - name: Инструменты (uv)
        id: tools
        run: |
          python3 deploy/ci/gha.py run --title "pip install uv" -- python3 -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Версии
        id: versions
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          {
            uv --version
            docker version --format 'docker {{.Server.Version}}'
            docker compose version
            psql "$DATABASE_URL" -Atc 'SHOW server_version' | sed 's/^/postgres /' || echo "postgres: нет ответа"
          } 2>&1 | tee versions.txt
          python3 deploy/ci/gha.py notice --title "Версии (test)" < versions.txt

      - name: make lint
        id: lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --title "make lint" -- make lint

      - name: make compose-check (docker compose config + tests/deploy)
        id: compose_check
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --title "make compose-check" -- make compose-check

      - name: make test (PostgreSQL 18)
        id: test
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --title "make test (PG 18)" -- make test

      - name: Frontend — npm ci, vitest, build (Node 24)
        id: frontend
        if: ${{ !cancelled() }}
        run: |
          python3 deploy/ci/gha.py run --title "frontend (node 24)" -- \
            docker run --rm -v "$PWD:/src" -w /src/app/frontend "$NODE_IMAGE" \
              sh -c 'npm ci --no-audit --no-fund && npm run test && npm run build'

      - name: Сводка гейтов (::notice)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 deploy/ci/gha.py summary

      # [Гипотеза] версия v4 не проверена из среды разработки (API GitHub закрыт).
      - name: Артефакт — журналы гейтов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ github.sha }}
          path: deploy/ci/out/gha/
          if-no-files-found: warn

  delivery:
    name: build + up/smoke/backup/restore + failover + check
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: bm:local
      BM_IMAGE: bm:local
    steps:
      - uses: actions/checkout@v5

      - name: Инструменты (uv)
        id: tools
        run: |
          python3 deploy/ci/gha.py run --title "pip install uv" -- python3 -m pip install --user "uv==${UV_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: deploy/.env стенда CI (секреты генерируются здесь и маскируются до записи)
        id: stand_env
        run: |
          cp deploy/.env.example deploy/.env
          set_var() { sed -i "s|^$1=.*|$1=$2|" deploy/.env; }
          pg="$(openssl rand -hex 24)"
          session="$(openssl rand -hex 32)"
          initial="init-$(openssl rand -hex 12)"
          bm_admin="ci-$(openssl rand -hex 12)"
          # Маски — до первого использования значений (4Д1): в журнале и аннотациях они заменяются на ***.
          for v in "$pg" "$session" "$initial" "$bm_admin"; do echo "::add-mask::$v"; done
          set_var POSTGRES_PASSWORD "$pg"
          set_var SESSION_SECRET "$session"
          set_var ADMIN_INITIAL_PASSWORD "$initial"
          set_var BM_ADMIN_PASSWORD "$bm_admin"
          # Пароль после смены нужен smoke и отказным тестам (tests/failover берёт BM_ADMIN_PASSWORD из окружения).
          echo "BM_ADMIN_PASSWORD=$bm_admin" >> "$GITHUB_ENV"
          grep -c '^[A-Z_]*=.' deploy/.env | sed 's/^/заполнено переменных: /'

      - name: make build
        id: build
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.stand_env.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --title "make build" -- make build

      - name: Версии и digest базовых образов (::notice, для закрепления по @sha256 в Dockerfile)
        id: digests
        if: ${{ !cancelled() }}
        run: |
          {
            docker version --format 'docker {{.Server.Version}}'
            docker compose version
            # Теги, а не закреплённые ссылки: видно, ушёл ли тег от digest в Dockerfile и ci.yml.
            for img in python:3.13-slim node:24-slim postgres:18 "${TRIVY_IMAGE%@*}"; do
              if docker pull -q "$img" >/dev/null 2>pull.err; then
                docker image inspect --format '{{index .RepoDigests 0}}' "$img" || echo "$img: нет RepoDigests"
              else
                echo "$img: pull не удался: $(tail -c 300 pull.err)"
              fi
            done
          } 2>&1 | tee digests.txt
          python3 deploy/ci/gha.py notice --title "Версии и digest базовых образов" < digests.txt

      - name: make up
        id: up
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make up" -- make up

      - name: make smoke
        id: smoke
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make smoke" -- make smoke

      - name: make backup
        id: backup
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make backup" -- make backup

      - name: make restore
        id: restore
        if: ${{ !cancelled() && steps.backup.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make restore" -- make restore

      - name: make smoke после restore
        id: smoke_after_restore
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make smoke после restore" -- make smoke

      - name: make failover (SC-002, SC-003)
        id: failover
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: python3 deploy/ci/gha.py run --stack --title "make failover" -- make failover

      - name: CHECK_STRICT=1 make check (SBOM, лицензии, pip-audit, npm audit, Trivy по образу)
        id: check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CHECK_STRICT: "1"
          # Trivy в контейнере: сокет Docker для доступа к образу, каталог проекта — по тому же пути (deploy/ci/out).
          TRIVY: >-
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
            -v ${{ github.workspace }}:${{ github.workspace }} -v trivy-cache:/root/.cache/trivy
            ${{ env.TRIVY_IMAGE }}
        run: python3 deploy/ci/gha.py run --title "CHECK_STRICT=1 make check" -- make check

      # Диагностика T099 (5Д3), при любом исходе make check (журнал недоступен — только аннотации): CRITICAL
      # с Target/PkgPath/FilePath и все установки certifi (версия, Target, FilePath) в bm:local и в базовом
      # образе ARG PYTHON_IMAGE (по digest) → одна ::notice. На гейт не влияет.
      - name: Trivy — путь certifi в образе и в базовом образе (::notice)
        id: trivy_paths
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # Trivy в контейнере: сокет Docker для доступа к образу, каталог проекта — по тому же пути (deploy/ci/out).
          TRIVY: >-
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
            -v ${{ github.workspace }}:${{ github.workspace }} -v trivy-cache:/root/.cache/trivy
            ${{ env.TRIVY_IMAGE }}
        run: |
          read -r -a trivy <<<"$TRIVY"
          base="$(sed -n 's/^ARG PYTHON_IMAGE=//p' deploy/Dockerfile)"
          echo "базовый образ: $base"
          mkdir -p deploy/ci/out
          docker pull -q "$base" >/dev/null || echo "pull $base не удался"
          "${trivy[@]}" image --quiet --format json --list-all-pkgs --severity CRITICAL \
            --output "$PWD/deploy/ci/out/trivy-base.json" "$base" || echo "trivy: отчёт по $base не получен"
          python3 deploy/ci/gha.py trivy --pkg certifi --json deploy/ci/out/trivy-critical.json \
            --json deploy/ci/out/trivy-base.json
          # Что в образе может дать находку без FilePath (92b3414): архивы, SBOM-файлы, любые certifi; число слоёв
          # (python-runtime — FROM scratch + копия очищенного корня, слоёв базового образа быть не должно).
          {
            echo "слоёв: $(docker image inspect --format '{{len .RootFS.Layers}}' "$IMAGE")"
            docker run --rm --entrypoint sh "$IMAGE" -c "find / -xdev \( -name '*.whl' -o -name '*.zip' \
              -o -name '*.egg' -o -name '*.pyz' -o -name '*.cdx.json' -o -name '*.spdx*' -o -name 'certifi*' \) \
              -not -path '/proc/*' 2>/dev/null | sort"
          } 2>&1 | tee deploy/ci/out/image-files.txt
          python3 deploy/ci/gha.py notice --title "Образ: архивы, SBOM, certifi" < deploy/ci/out/image-files.txt

      - name: Попытка make egress-host-check (root на раннере)
        id: egress
        # Попытка (3Д1(б)): результат виден в аннотации; сбой не роняет прогон — гейт ставит QA (T089).
        continue-on-error: true
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        run: |
          python3 deploy/ci/gha.py run --title "egress-host-check (попытка)" -- \
            sudo env "PATH=$PATH" "HOME=$HOME" "BM_ADMIN_PASSWORD=$BM_ADMIN_PASSWORD" make egress-host-check

      - name: Журналы стека
        if: always()
        run: |
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env ps -a || true
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --no-color > compose-logs.txt 2>&1 || true
          echo "=== compose-logs.txt (хвост) ==="; tail -n 300 compose-logs.txt || true

      - name: Остановить стек
        if: always()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env down -v || true

      # Сводка make check и sha256 SBOM — в журнал (сверка с артефактом); сами SBOM — только артефактом (4Д3).
      - name: Сводка make check и sha256 SBOM — в журнал
        if: always()
        run: |
          echo "=== deploy/ci/out/summary.txt ==="; cat deploy/ci/out/summary.txt || true
          for f in deploy/ci/out/sbom-*.cdx.json; do
            [ -f "$f" ] && echo "sha256 $(sha256sum "$f")"
          done
          true

      - name: Сводка гейтов (::notice)
        if: always()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 deploy/ci/gha.py summary

      # [Гипотеза] версия v4 не проверена из среды разработки (API GitHub закрыт).
      - name: Артефакт — SBOM, сводка make check, журналы гейтов и compose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.sha }}
          path: |
            deploy/ci/out/
            compose-logs.txt
          if-no-files-found: warn
