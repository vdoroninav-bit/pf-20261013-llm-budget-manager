; Настройки pytest для корневого tests/ (12_plan.md §5.2). Запуск — через make, интерпретатор — venv app/backend.
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    db: тест использует PostgreSQL (DATABASE_URL)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
